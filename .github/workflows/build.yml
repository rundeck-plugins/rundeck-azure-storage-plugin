name: Build and Test

on: [push]

permissions:
  contents: read

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest
    
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit

    - uses: rundeck-plugins/.github/.github/actions/setup-java@main
    - name: Fetch tags
      run: git fetch --tags --force

    - name: Validate Gradle wrapper
      uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6 # v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      with:
        gradle-home-cache-cleanup: true
        gradle-version: wrapper
        cache-disabled: false

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build --no-daemon --stacktrace

    - name: Get version
      id: get_version
      run: |
        VERSION=$(./gradlew currentVersion -q -Prelease.quiet)
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Upload build artifacts
      uses: rundeck-plugins/.github/.github/actions/upload-artifact@main
      with:
        name: rundeck-azure-storage-plugin-${{ steps.get_version.outputs.VERSION }}
        path: ./build/libs/rundeck-azure-storage-plugin-*.zip
        retention-days: 30
        if-no-files-found: error

    - name: Upload build reports
      uses: rundeck-plugins/.github/.github/actions/upload-artifact@main
      if: failure()
      with:
        name: build-reports
        path: build/reports/
        retention-days: 7